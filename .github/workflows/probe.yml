name: Probe YGOMobile resources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: 檢出專案原始碼
        uses: actions/checkout@v4

      - name: 測試場地卡圖網址（海 22702055、闇 59197169）
        continue-on-error: true
        run: |
          for id in 22702055 59197169; do
            for u in \
              "https://cdn.233.momobako.com/ygopro/pics/field/$id.jpg" \
              "https://cdn.233.momobako.com/ygopro/pics/field/$id.png" \
              "https://cdn.233.momobako.com/ygopro/field/$id.png" \
              "https://cdn.233.momobako.com/ygopro/pics/$id.jpg"
            do
              curl -s -L -o /dev/null --max-time 20 \
                -w "%{http_code} %{content_type} %{size_download}B  $u\n" "$u" || echo "000 連線失敗  $u"
            done
          done

      - name: 列出 assets 完整結構同大小
        continue-on-error: true
        run: |
          echo "=== assets/data 一層（完整）==="
          ls -la mobile/assets/data
          echo "=== 各資料夾大小 ==="
          du -sh mobile/assets/data/* 2>/dev/null
          echo "=== git 內有冇音效檔 ==="
          git ls-files | grep -i -E "sound|\.ogg$|\.mp3$|\.wav$" | head -30 || true

      - name: 睇啟動複製資源同音效載入邏輯
        continue-on-error: true
        run: |
          echo "=== ResCheckTask 全檔行數 ==="
          wc -l mobile/src/main/java/cn/garymb/ygomobile/ui/home/ResCheckTask.java
          echo "=== ResCheckTask 第 240-300 行 ==="
          sed -n '240,300p' mobile/src/main/java/cn/garymb/ygomobile/ui/home/ResCheckTask.java
          echo "=== getDatapath 定義 ==="
          grep -n -A6 "getDatapath(" mobile/src/main/java/cn/garymb/ygomobile/ui/home/ResCheckTask.java | head -30
          echo "=== MainActivity 第 200-225 行（NETWORK_IMAGE）==="
          sed -n '200,225p' mobile/src/main/java/cn/garymb/ygomobile/ui/home/MainActivity.java
          echo "=== ImageUpdater 第 330-380 行 ==="
          sed -n '330,380p' mobile/src/main/java/cn/garymb/ygomobile/ui/home/ImageUpdater.java

      - name: 列出上游 YGOMobile release 附件（搵音效包）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/fallenstardust/YGOMobile-cn-ko-en/releases?per_page=15" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if isinstance(d, list):
              for r in d:
                  print(r['tag_name'], [(a['name'], a['size']) for a in r.get('assets', [])][:12])
          else:
              print(d)
          "
