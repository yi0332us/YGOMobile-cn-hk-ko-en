name: Probe YGOMobile resources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: 檢出專案原始碼
        uses: actions/checkout@v4

      - name: 上游原版 Constants 嘅先行卡網址 + 測試狀態
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/fallenstardust/YGOMobile-cn-ko-en.git /tmp/upstream
          F=$(find /tmp/upstream -name Constants.java | head -1)
          echo "檔案: $F"
          echo "=== 原版先行卡相關常數 ==="
          grep -n -E "YGO233_ADVANCE|CN_DATAVER|PRE_CARD|SUPERPRE|Super_Pre|ygopro-super-pre" "$F"
          echo "=== 逐條測試（取前 200 bytes）==="
          for u in $(grep -E "YGO233_ADVANCE|CN_DATAVER|PRE_CARD|SUPERPRE" "$F" | grep -oE 'https?://[^"]+' | sort -u); do
            curl -s -L -o /dev/null -r 0-200 --max-time 25 \
              -w "%{http_code} %{content_type} %{size_download}B  $u\n" "$u" || echo "000 連線失敗  $u"
          done

      - name: 先行卡喺程式碼入面點樣被使用（你嘅 repo）
        continue-on-error: true
        run: |
          grep -rn -E "URL_CN_DATAVER|URL_PRE_CARD|URL_SUPERPRE_CN_FILE|URL_YGO233_ADVANCE|officialExCardPackageName" mobile/src/main/java | head -30
          echo "=== 提示字串 ==="
          grep -rn "未取得到先行卡\|未取得到先行卡资讯\|未取得到先行卡资讯" mobile/src/main | head -5
          grep -rn "expansions" mobile/src/main/java | head -20

      - name: 語言切換相關程式碼（閃退調查）
        continue-on-error: true
        run: |
          grep -rn -i -E "data_lang|datalang|DataLanguage|PREF_.*LANG|switchLang|changeLang" mobile/src/main/java | head -40
          echo "=== 語言按鈕字串／資源 ==="
          grep -rn -E "简体中文|簡體中文|한국어|조선말" mobile/src/main --include=*.xml --include=*.java | head -20
          echo "=== ICP 字串位置 ==="
          grep -rn "ICP" mobile/src/main --include=*.xml --include=*.java | head -10
