name: Build YGOMobile TC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 檢出專案原始碼
        uses: actions/checkout@v4

      - name: 配置 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝 OpenCC
        run: pip install opencc

      - name: 下載 libWindbot.aar（並驗證係真 AAR）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p mobile/libs
          # 喺 mercury233/libWindbot 嘅 releases 入面搵第一個 .aar 附件
          URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/mercury233/libWindbot/releases?per_page=30" \
            | python3 -c "
          import sys, json
          for rel in json.load(sys.stdin):
              for a in rel.get('assets', []):
                  if a['name'].lower().endswith('.aar'):
                      print(a['browser_download_url']); sys.exit(0)
          ")
          echo "AAR URL = $URL"
          if [ -z "$URL" ]; then
            echo "::error::搵唔到任何 .aar 附件，請手動上載 libWindbot.aar 到 mobile/libs/"
            exit 1
          fi
          curl -fL -o mobile/libs/libWindbot.aar "$URL"
          ls -l mobile/libs/libWindbot.aar
          # 驗證：真 AAR 一定有 AndroidManifest.xml
          unzip -l mobile/libs/libWindbot.aar | grep -q AndroidManifest.xml \
            || { echo "::error::下載咗嘅唔係有效 AAR"; exit 1; }

      - name: 下載卡庫、字型、腳本
        run: |
          set -e
          mkdir -p mobile/assets/data/fonts
          zip -q mobile/assets/data/pics.zip .gitignore
          curl -fL -o mobile/assets/data/cards.cdb https://github.com/mycard/ygopro-database/raw/master/locales/zh-CN/cards.cdb
          curl -fL -o mobile/assets/data/strings.conf https://github.com/mycard/ygopro-database/raw/master/locales/zh-CN/strings.conf
          curl -fL -o mobile/assets/data/fonts/ygo.ttf https://github.com/fallenstardust/YGOMobile-cn-ko-en/releases/download/sounds/ygo.ttf
          curl -fL -o scripts_master.zip https://github.com/mycard/ygopro-scripts/archive/refs/heads/master.zip
          unzip -q scripts_master.zip
          mv ygopro-scripts-master script
          zip -rq mobile/assets/data/scripts.zip script
          rm -rf script scripts_master.zip

      - name: 繁中化卡庫與系統提示
        run: |
          python - << 'PYEOF'
          import os, re, sqlite3, opencc
          import xml.etree.ElementTree as ET

          cc = opencc.OpenCC('s2twp.json')

          cdb_path = 'mobile/assets/data/cards.cdb'
          conn = sqlite3.connect(cdb_path)
          c = conn.cursor()
          cols = ['name', 'desc'] + [f'str{i}' for i in range(1, 17)]
          c.execute(f"SELECT id, {', '.join(cols)} FROM texts")
          rows = c.fetchall()
          updated = [tuple(cc.convert(v) if v else '' for v in r[1:]) + (r[0],) for r in rows]
          c.executemany(
              f"UPDATE texts SET {', '.join(k + '=?' for k in cols)} WHERE id=?", updated)
          conn.commit()
          conn.close()
          print('cards.cdb 完成', len(rows))

          conf_path = 'mobile/assets/data/strings.conf'
          with open(conf_path, 'r', encoding='utf-8', errors='ignore') as f:
              text = f.read()
          with open(conf_path, 'w', encoding='utf-8') as f:
              f.write(cc.convert(text))
          print('strings.conf 完成')

          xml_path = 'mobile/src/main/res/values/strings.xml'
          if os.path.exists(xml_path):
              with open(xml_path, 'r', encoding='utf-8') as f:
                  text = f.read()
              out = re.sub(r'>([^<]+)<', lambda m: '>' + cc.convert(m.group(1)) + '<', text)
              ET.fromstring(out.encode('utf-8'))   # 轉完要仲係合法 XML，否則即刻報錯
              with open(xml_path, 'w', encoding='utf-8') as f:
                  f.write(out)
              print('strings.xml 完成（XML 驗證通過）')
          PYEOF

      - name: 配置 Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Android NDK (r29)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: 編譯遊戲 C++ 核心
        run: |
          chmod +x gradlew
          ./gradlew :libcore:buildYgoCore

      - name: 打包 APK（只打 cn 版 debug）
        run: ./gradlew :mobile:assembleCnDebug --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m"

      - name: 診斷 APK 位置（唔會令 workflow 失敗）
        continue-on-error: true
        run: |
          echo "=== 1. 全機近 90 分鐘內新產生嘅 apk/aab/ap_ 檔 ==="
          sudo find / -xdev -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.ap_" \) -mmin -90 \
            -printf '%s %p\n' 2>/dev/null | sort -n | tail -30
          echo "=== 2. 所有名叫 outputs 嘅目錄 ==="
          find / -xdev -type d -name outputs -path "*build*" 2>/dev/null | head -20
          echo "=== 3. mobile 模組 build 目錄頂層 ==="
          ls -la mobile/build 2>/dev/null || echo "mobile/build 唔存在"
          ls -R mobile/build/outputs 2>/dev/null | head -60
          echo "=== 4. intermediates/apk 內容 ==="
          find / -xdev -path "*intermediates/apk*" -type f 2>/dev/null | head -20
          echo "=== 5. gradle 設定入面同輸出位置有關嘅行 ==="
          grep -rn -E "buildDir|layout\.buildDirectory|outputFileName|archivesBaseName|destinationDir|\.apk" \
            --include=*.gradle --include=*.kts --include=gradle.properties . 2>/dev/null | head -40

      - name: 收集 APK
        run: |
          mkdir -p dist
          echo "=== 全部 APK（大小 路徑）==="
          find "$GITHUB_WORKSPACE" "$HOME" /tmp -xdev -type f -name "*.apk" \
            -not -path "*/dist/*" -not -path "*/.gradle/caches/*" -printf '%s %p\n' 2>/dev/null | sort -n
          find "$GITHUB_WORKSPACE" "$HOME" /tmp -xdev -type f -name "*.apk" \
            -not -path "*/dist/*" -not -path "*/.gradle/caches/*" \
            -not -iname "*androidTest*" -not -iname "*unaligned*" \
            -size +1M -exec cp -v {} dist/ \; 2>/dev/null || true
          ls -lh dist/
          ls dist/*.apk > /dev/null 2>&1 || { echo "::error::搵唔到 APK，睇上一步診斷輸出"; exit 1; }

      - name: 上載 APK
        uses: actions/upload-artifact@v4
        with:
          name: YGOMobile-TC
          path: dist/*.apk
          if-no-files-found: error
