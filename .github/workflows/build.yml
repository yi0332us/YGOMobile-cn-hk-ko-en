name: Build YGOMobile TC

on:
  workflow_dispatch:
    inputs:
      network_image:
        description: '開啟網上卡圖下載（會逐張下載全卡庫，預設唔開）'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # 加入此行賦予建立 Release 與 push 權限
    env:
      SUPERPRE_BASE: https://raw.githubusercontent.com/yi0332us/ygomobile-superpre-hk/main
    steps:
      - name: 檢出專案原始碼
        uses: actions/checkout@v4

      - name: 配置 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝 OpenCC
        run: pip install opencc

      - name: 下載 libWindbot.aar（並驗證係真 AAR）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p mobile/libs
          # 喺 mercury233/libWindbot 嘅 releases 入面搵第一個 .aar 附件
          URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/mercury233/libWindbot/releases?per_page=30" \
            | python3 -c "
          import sys, json
          for rel in json.load(sys.stdin):
              for a in rel.get('assets', []):
                  if a['name'].lower().endswith('.aar'):
                      print(a['browser_download_url']); sys.exit(0)
          ")
          echo "AAR URL = $URL"
          if [ -z "$URL" ]; then
            echo "::error::搵唔到任何 .aar 附件，請手動上載 libWindbot.aar 到 mobile/libs/"
            exit 1
          fi
          curl -fL -o mobile/libs/libWindbot.aar "$URL"
          ls -l mobile/libs/libWindbot.aar
          # 驗證：真 AAR 一定有 AndroidManifest.xml
          unzip -l mobile/libs/libWindbot.aar | grep -q AndroidManifest.xml \
            || { echo "::error::下載咗嘅唔係有效 AAR"; exit 1; }

      - name: 下載卡庫、字型、腳本
        run: |
          set -e
          mkdir -p mobile/assets/data/fonts
          zip -q mobile/assets/data/pics.zip .gitignore
          curl -fL -o mobile/assets/data/cards.cdb https://github.com/mycard/ygopro-database/raw/master/locales/zh-CN/cards.cdb
          curl -fL -o mobile/assets/data/fonts/ygo.ttf https://github.com/fallenstardust/YGOMobile-cn-ko-en/releases/download/sounds/ygo.ttf
          curl -fL -o scripts_master.zip https://github.com/mycard/ygopro-scripts/archive/refs/heads/master.zip
          unzip -q scripts_master.zip
          mv ygopro-scripts-master script
          zip -rq mobile/assets/data/scripts.zip script
          rm -rf script scripts_master.zip

      - name: 由官方 APK 攞卡圖包（pics.zip）同音效／音樂
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          CANDS=()
          # 1) 首選：GitHub release-latest 嘅 APK（GitHub 機房直連，最穩）
          GH_URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/fallenstardust/YGOMobile-cn-ko-en/releases/tags/release-latest" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for a in d.get('assets', []):
              if a['name'].lower().endswith('.apk'):
                  print(a['browser_download_url']); break
          ")
          [ -n "$GH_URL" ] && CANDS+=("$GH_URL")
          # 2) 後備：由專案 versionName 砌 files.ygom.top 直連（呢個來源曾經回 403，只作備用）
          VER=$(grep -hE "versionName" mobile/build.gradle build.gradle 2>/dev/null \
                | grep -oE "[0-9]+\.[0-9]+(\.[0-9]+)?" | head -1)
          echo "專案 versionName = [$VER]"
          [ -n "$VER" ] && CANDS+=("https://files.ygom.top/files/YGOMobile_${VER}.Apk")
          # 3) 後備：官方版本檔 ver_code.json（App 自己都讀呢個），印出內容方便除錯
          curl -fsSL --max-time 30 https://ygom.top/ver_code.json -o /tmp/ver.json && {
            echo "=== ver_code.json ==="; head -c 600 /tmp/ver.json; echo
            for u in $(grep -oiE "https?://[^\"' ]+\.apk" /tmp/ver.json); do CANDS+=("$u"); done
            V2=$(grep -oE "[0-9]+\.[0-9]+\.[0-9]+" /tmp/ver.json | head -1)
            [ -n "$V2" ] && CANDS+=("https://files.ygom.top/files/YGOMobile_${V2}.Apk")
          }
          printf '候選來源:\n'; printf '  %s\n' "${CANDS[@]}"
          URL=""
          for u in "${CANDS[@]}"; do
            echo ">>> 嘗試 $u"
            rm -f official.apk
            CODE=$(curl -sL --max-time 900 -o official.apk -w "%{http_code}" \
              -A "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36" \
              -e "https://ygom.top/" "$u")
            echo "    HTTP $CODE"
            [ "$CODE" = "200" ] || continue
            SZ=$(stat -c %s official.apk)
            if [ "$SZ" -gt 50000000 ] && python3 -c "import zipfile,sys; sys.exit(0 if zipfile.is_zipfile('official.apk') else 1)"; then
              URL="$u"; break
            fi
            echo "    大細 $SZ，唔似有效 APK，換下一個"
          done
          echo "官方 APK = $URL"
          if [ -z "$URL" ]; then
            echo "::warning::所有來源都下載唔到官方 APK，今次用佔位卡圖包"
            exit 0
          fi
          ls -l official.apk
          python3 - << 'PYEOF'
          import zipfile, os, collections
          z = zipfile.ZipFile('official.apk')
          names = [n for n in z.namelist() if n.startswith('assets/') and not n.endswith('/')]

          # 1. 官方 assets 頂層結構同大小
          top = collections.Counter()
          for i in z.infolist():
              if i.filename.startswith('assets/') and not i.filename.endswith('/'):
                  parts = i.filename.split('/')
                  top['/'.join(parts[:2])] += i.file_size
          print('=== 官方 APK assets 頂層（由大到細）===')
          for k, v in top.most_common(40):
              print(f'{v:>12,}  {k}')
          print('=== 官方 APK 內所有 .cdb ===')
          for i in z.infolist():
              if i.filename.lower().endswith('.cdb'):
                  print(f'{i.file_size:>12,}  {i.filename}')

          # 2. 卡圖包：取代佔位檔
          if 'assets/data/pics.zip' in names:
              z.extract('assets/data/pics.zip', 'official_x')
              os.replace('official_x/assets/data/pics.zip', 'mobile/assets/data/pics.zip')
              print('已用官方 pics.zip 取代佔位檔:', os.path.getsize('mobile/assets/data/pics.zip'), 'bytes')
          else:
              print('::warning::官方 APK 冇 assets/data/pics.zip')

          # 3. 通用補齊：repo 入面冇嘅 assets 檔（BGM、其他語言資料等）一律由官方補上；已存在嘅唔覆蓋
          added = []
          for n in names:
              target = os.path.join('mobile', n)
              if os.path.exists(target):
                  continue
              os.makedirs(os.path.dirname(target), exist_ok=True)
              with z.open(n) as src, open(target, 'wb') as dst:
                  dst.write(src.read())
              added.append(target)
          with open('.official_added.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(added))
          bydir = collections.Counter('/'.join(p.split('/')[:4]) for p in added)
          print(f'=== 由官方補入 {len(added)} 個檔（repo 本身冇）===')
          for k, v in bydir.most_common(30):
              print(f'{v:>6} 個  {k}')
          PYEOF
          rm -rf official.apk official_x
          du -sh mobile/assets/data/pics.zip mobile/assets/data/sound 2>/dev/null
          exit 0

      - name: 補齊官方 pics.zip 冇嘅卡圖（建置時下載，內置入 APK）
        timeout-minutes: 30
        run: |
          python3 - << 'PYEOF'
          import collections
          import concurrent.futures as cf
          import os
          import sqlite3
          import sys
          import urllib.error
          import urllib.request
          import zipfile

          PICS = 'mobile/assets/data/pics.zip'
          CDB = 'mobile/assets/data/cards.cdb'
          URLS = [
              os.environ.get('PIC_URL_1', 'https://cdn.233.momobako.com/ygopro/pics/{id}.jpg'),
              os.environ.get('PIC_URL_2', 'https://images.ygoprodeck.com/images/cards/{id}.jpg'),
          ]
          MAX_N = int(os.environ.get('PIC_MAX', '8000'))
          UA = {'User-Agent': 'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36'}

          z = zipfile.ZipFile(PICS)
          jpgs = [n for n in z.namelist() if n.lower().endswith('.jpg')]
          z.close()
          have = {os.path.basename(n)[:-4] for n in jpgs}
          print('官方 pics.zip 現有卡圖張數:', len(have))
          if len(have) < 1000:
              print('::warning::官方卡圖包唔似正常（少過 1000 張），今次唔補圖，避免一次過下載全庫')
              sys.exit(0)
          prefix = collections.Counter(os.path.dirname(n) for n in jpgs).most_common(1)[0][0]
          print('zip 內卡圖路徑前綴:', repr(prefix))

          conn = sqlite3.connect(CDB)
          ids = [str(r[0]) for r in conn.execute(
              "SELECT d.id FROM datas d JOIN texts t ON t.id = d.id "
              "WHERE (d.type & 16384) = 0 AND t.name != ''")]
          conn.close()
          missing = sorted(set(ids) - have, key=int, reverse=True)
          print(f'卡庫共 {len(ids)} 張（不含衍生物），缺卡圖 {len(missing)} 張')
          if len(missing) > MAX_N:
              print(f'::warning::缺圖超過上限 {MAX_N}，只補最新（編號最大）嘅 {MAX_N} 張')
              missing = missing[:MAX_N]


          def fetch(cid):
              for idx, fmt in enumerate(URLS):
                  url = fmt.format(id=cid)
                  for attempt in range(2):
                      try:
                          req = urllib.request.Request(url, headers=UA)
                          with urllib.request.urlopen(req, timeout=20) as r:
                              data = r.read()
                          if len(data) > 2048 and data[:3] == b'\xff\xd8\xff':
                              return cid, data, idx
                          break  # 唔係 JPEG，試下一個來源
                      except urllib.error.HTTPError as e:
                          if e.code == 404:
                              break
                      except Exception:
                          pass
              return cid, None, None


          name = lambda cid: (prefix + '/' if prefix else '') + cid + '.jpg'
          added = [0] * len(URLS)
          notfound = []
          batch = []


          def flush(batch):
              if not batch:
                  return
              with zipfile.ZipFile(PICS, 'a', compression=zipfile.ZIP_STORED) as zf:
                  for cid, data in batch:
                      zf.writestr(name(cid), data)
              batch.clear()


          done = 0
          with cf.ThreadPoolExecutor(max_workers=8) as ex:
              for cid, data, idx in ex.map(fetch, missing):
                  done += 1
                  if data is None:
                      notfound.append(cid)
                  else:
                      added[idx] += 1
                      batch.append((cid, data))
                      if len(batch) >= 300:
                          flush(batch)
                  if done % 500 == 0:
                      print(f'進度 {done}/{len(missing)}')
          flush(batch)
          print(f'補圖完成：主來源 {added[0]} 張，後備來源 {added[1] if len(added) > 1 else 0} 張，兩邊都冇 {len(notfound)} 張')
          if notfound:
              print('仍然冇圖嘅卡號（最新 30 個）:', ', '.join(notfound[:30]))
          print('pics.zip 最終大小:', os.path.getsize(PICS), 'bytes')
          PYEOF

      - name: 改介面文字（簡體中文→繁體中文；ICP 備案→繁體中文化 Powered by Claude & Gemini）
        run: |
          python3 - << 'PYEOF'
          import os, re
          hits = {'lang': 0, 'icp': 0}
          for root, dirs, files in os.walk('mobile/src/main/res'):
              for f in files:
                  if not f.endswith('.xml'):
                      continue
                  p = os.path.join(root, f)
                  try:
                      t = open(p, encoding='utf-8').read()
                  except UnicodeDecodeError:
                      continue
                  n = t
                  n, c1 = re.subn(r'(?<=[>"])\s*(?:简体中文|簡體中文)\s*(?=[<"])', '繁體中文', n)
                  n, c2 = re.subn(r'浙ICP[备備][0-9A-Za-z\-號号]*', '繁體中文化 Powered by Claude &amp; Gemini', n)
                  if c1 or c2:
                      open(p, 'w', encoding='utf-8').write(n)
                      hits['lang'] += c1
                      hits['icp'] += c2
                      print(f'{p}: 語言標籤 {c1} 處, ICP {c2} 處')
          print('合共', hits)
          if hits['lang'] == 0:
              print('::warning::res 內搵唔到「簡體中文」標籤，可能硬編碼喺 Java／layout')
          if hits['icp'] == 0:
              print('::warning::res 內搵唔到浙ICP文字，可能硬編碼喺 Java／layout')
          PYEOF
          echo "=== Java／其他位置仲有冇相關字串（只列出，唔改）==="
          grep -rn -E "简体中文|簡體中文|浙ICP" mobile/src/main --include=*.java --include=*.kt 2>/dev/null | head -20 || true

      - name: 繁中化卡庫與系統提示
        run: |
          python - << 'PYEOF'
          import os, re, sqlite3, opencc
          import xml.etree.ElementTree as ET

          cc = opencc.OpenCC('s2twp.json')

          # 1. 繁中化 cards.cdb
          cdb_path = 'mobile/assets/data/cards.cdb'
          conn = sqlite3.connect(cdb_path)
          c = conn.cursor()
          cols = ['name', 'desc'] + [f'str{i}' for i in range(1, 17)]
          c.execute(f"SELECT id, {', '.join(cols)} FROM texts")
          rows = c.fetchall()
          updated = [tuple(cc.convert(v) if v else '' for v in r[1:]) + (r[0],) for r in rows]
          c.executemany(
              f"UPDATE texts SET {', '.join(k + '=?' for k in cols)} WHERE id=?", updated)
          conn.commit()
          conn.close()
          print('cards.cdb 完成', len(rows))

          # 2. 繁中化本專案內建手機版 strings.conf 並同步輸出雙路徑
          conf_src = 'mobile/assets/data/conf/strings.conf'
          if not os.path.exists(conf_src):
              conf_src = 'mobile/assets/data/strings.conf'

          with open(conf_src, 'r', encoding='utf-8') as f:
              text = f.read()

          converted_conf = cc.convert(text)

          # 完整性檢查：條目編號必須同原檔完全一致，並確認關鍵字串存在
          ids = lambda t: re.findall(r'^!(\w+)\s+(\S+)', t, re.M)
          before, after = ids(text), ids(converted_conf)
          print('strings.conf 來源:', conf_src, '| 條目數 前/後 =', len(before), len(after))
          assert before == after, '轉換後條目編號同原檔唔一致'
          for kw_s, kw_t in [('显示场地背景', '顯示場地背景'), ('启用起源点数模式', '啟用起源點數模式')]:
              print(f'原檔有「{kw_s}」:', kw_s in text, '| 轉換後有「{kw_t}」:'.replace('{kw_t}', kw_t), kw_t in converted_conf)

          os.makedirs('mobile/assets/data/conf', exist_ok=True)
          with open('mobile/assets/data/conf/strings.conf', 'w', encoding='utf-8') as f:
              f.write(converted_conf)
          with open('mobile/assets/data/strings.conf', 'w', encoding='utf-8') as f:
              f.write(converted_conf)
          print('strings.conf 繁中化完成（已鏡像至 data/ 及 data/conf/）')

          # 3. 繁中化伺服器清單 serverlist.xml
          for s_path in ['mobile/src/main/assets/serverlist.xml', 'mobile/assets/serverlist.xml', 'mobile/src/main/assets/server_list.xml']:
              if os.path.exists(s_path):
                  with open(s_path, 'r', encoding='utf-8') as f:
                      s_text = f.read()
                  converted_s = cc.convert(s_text)
                  ET.fromstring(converted_s.encode('utf-8'))
                  with open(s_path, 'w', encoding='utf-8') as f:
                    f.write(converted_s)
                  print(f'{s_path} 伺服器列表完成')

          # 4. 繁中化說明文檔（嚴格 UTF-8；解碼失敗或冇變化就唔郁，避免弄壞檔案）
          #    由官方補入嘅檔案（其他語言資料等）一律唔轉換
          added = set()
          if os.path.exists('.official_added.txt'):
              added = set(open('.official_added.txt', encoding='utf-8').read().split('\n'))
          for root, dirs, files in os.walk('mobile'):
              if 'assets' in root and 'build' not in root and '/sound' not in root:
                  for file in files:
                      if file.endswith(('.txt', '.html', '.md', '.json')) and not file.endswith(('output-metadata.json', 'version.txt')):
                          fpath = os.path.join(root, file)
                          if fpath in added:
                              continue
                          try:
                              with open(fpath, 'r', encoding='utf-8') as f:
                                  content = f.read()
                              conv = cc.convert(content)
                              if conv != content:
                                  with open(fpath, 'w', encoding='utf-8') as f:
                                      f.write(conv)
                                  print(f'文本資源完成: {fpath}')
                          except UnicodeDecodeError:
                              print(f'跳過（非 UTF-8）: {fpath}')

          # 5. 繁中化 strings.xml
          xml_path = 'mobile/src/main/res/values/strings.xml'
          if os.path.exists(xml_path):
              with open(xml_path, 'r', encoding='utf-8') as f:
                  text = f.read()
              out = re.sub(r'>([^<]+)<', lambda m: '>' + cc.convert(m.group(1)) + '<', text)
              ET.fromstring(out.encode('utf-8'))
              with open(xml_path, 'w', encoding='utf-8') as f:
                  f.write(out)
              print('strings.xml 完成')
          PYEOF


      - name: 修補 Constants.java（卡圖、先行卡、更新網址；每項取代次數都驗證）
        env:
          NET_IMG: ${{ inputs.network_image }}
          UPDATE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/ver_code.json
        run: |
          python3 - << 'PYEOF'
          import os, re, subprocess
          p = 'mobile/src/main/java/cn/garymb/ygomobile/Constants.java'
          s = open(p, encoding='utf-8').read()
          base = os.environ['SUPERPRE_BASE']
          rules = [
              ('IMAGE_URL', 'https://cdn.233.momobako.com/ygopro/pics/%s.jpg'),
              ('IMAGE_FIELD_URL', 'https://cdn.233.momobako.com/ygopro/pics/field/%s.jpg'),
              ('URL_CN_DATAVER', base + '/version.txt'),
              ('URL_PRE_CARD', base + '/test-release.json'),
              ('URL_SUPERPRE_CN_FILE', base + '/ygopro-super-pre.ypk'),
              ('URL_SUPERPRE_CN_FILE_ALT', base + '/ygopro-super-pre.ypk'),
          ]
          for name, url in rules:
              pat = r'String\s+' + name + r'\s*=\s*"[^"]*";'
              s, n = re.subn(pat, lambda m: 'String ' + name + ' = "' + url + '";', s)
              print(f'{name}: 取代 {n} 次')
              assert n == 1, f'{name} 取代次數唔係 1（係 {n}），停止'
          print('--- 同更新／版本檔有關嘅常數（供核對，唔會改）---')
          for m in re.finditer(r'String\s+(URL_[A-Z0-9_]*)\s*=\s*"([^"]*(?:ver_code|update|version)[^"]*)";', s, re.I):
              print(' ', m.group(1), '=', m.group(2))
          s, n = re.subn(r'String\s+URL_UPDATE\s*=\s*"[^"]*";',
                         lambda m: 'String URL_UPDATE = "' + os.environ['UPDATE_URL'] + '";', s)
          print('URL_UPDATE: 取代', n, '次')
          if n != 1:
              print('::warning::搵唔到剛好一個 URL_UPDATE，自動更新網址未改，請睇上面清單')
          if os.environ.get('NET_IMG') == 'true':
              s, n3 = re.subn(r'boolean\s+NETWORK_IMAGE\s*=\s*false;', 'boolean NETWORK_IMAGE = true;', s)
              assert n3 == 1, 'NETWORK_IMAGE 取代次數唔係 1'
              print('網上卡圖：已開啟（會逐張下載全卡庫）')
          else:
              print('網上卡圖：保持關閉（卡圖已內置喺 pics.zip）')
          open(p, 'w', encoding='utf-8').write(s)
          PYEOF
          grep -n -E "String (IMAGE_URL|IMAGE_FIELD_URL|URL_CN_DATAVER|URL_PRE_CARD|URL_SUPERPRE_CN_FILE|URL_SUPERPRE_CN_FILE_ALT|URL_UPDATE) =|NETWORK_IMAGE =" mobile/src/main/java/cn/garymb/ygomobile/Constants.java

      - name: 將易出 502 嘅 Aliyun google / gradle-plugin 鏡像換成官方源
        run: |
          python3 - << 'PYEOF'
          import os, re
          rules = [
              (re.compile(r'https?://maven\.aliyun\.com/(?:repository|nexus/content/(?:groups|repositories))/google/?'),
               'https://dl.google.com/dl/android/maven2/'),
              (re.compile(r'https?://maven\.aliyun\.com/(?:repository|nexus/content/(?:groups|repositories))/gradle-plugin/?'),
               'https://plugins.gradle.org/m2/'),
          ]
          total = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'build', '.gradle', 'node_modules')]
              for f in files:
                  if not (f.endswith('.gradle') or f.endswith('.gradle.kts') or f.endswith('.kts') or f == 'gradle.properties'):
                      continue
                  p = os.path.join(root, f)
                  try:
                      t = open(p, encoding='utf-8').read()
                  except UnicodeDecodeError:
                      continue
                  n = t
                  cnt = 0
                  for rx, rep in rules:
                      n, c = rx.subn(rep, n)
                      cnt += c
                  if cnt:
                      open(p, 'w', encoding='utf-8').write(n)
                      total += cnt
                      print(f'{p}: 取代 {cnt} 處')
          print('合共取代', total, '處')
          PYEOF
          echo "=== 仲剩低嘅其他鏡像（保持不變）==="
          grep -rn --include=*.gradle --include=*.kts --include=gradle.properties -E "aliyun|huaweicloud|tencent" . 2>/dev/null | grep -v "/build/" | head -20 || true

      - name: 配置 Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Android NDK (r29)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: 還原固定簽名（ci/debug.keystore），令更新可以直接覆蓋安裝
        run: |
          if [ -f ci/debug.keystore ]; then
            mkdir -p ~/.android
            cp ci/debug.keystore ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | head -4
          else
            echo "::warning::倉庫冇 ci/debug.keystore：每次 build 簽名都唔同，新版本將無法覆蓋安裝舊版（要先解除安裝）"
          fi

      - name: Gradle 依賴快取
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 編譯遊戲 C++ 核心
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            echo "=== buildYgoCore 第 $i 次嘗試 ==="
            ./gradlew :libcore:buildYgoCore -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000 && exit 0
            sleep 20
          done
          exit 1

      - name: 打包 APK（只打 cn 版 debug）
        run: |
          for i in 1 2 3; do
            echo "=== assembleCnDebug 第 $i 次嘗試 ==="
            ./gradlew :mobile:assembleCnDebug --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m" -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000 && exit 0
            sleep 20
          done
          exit 1

      - name: 收集 APK（副檔名係 .Apk，要唔分大細楷）
        run: |
          mkdir -p dist
          find mobile/build/outputs/apk -type f -iname "*.apk" | while read -r f; do
            base=$(basename "${f%.*}")
            cp -v "$f" "dist/${base}.apk"
          done
          ls -lh dist/
          ls dist/*.apk > /dev/null 2>&1 || { echo "::error::搵唔到 APK"; exit 1; }

      - name: 上載 APK
        uses: actions/upload-artifact@v4
        with:
          name: YGOMobile-TC
          path: dist/*.apk
          if-no-files-found: error
          
      - name: 發布繁中版 Release 並更新 ver_code.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          APK_PATH=$(find mobile/build/outputs/apk -iname "*.apk" | head -1)
          [ -n "$APK_PATH" ] || { echo "::error::找不到編譯產出的 APK！"; exit 1; }

          VER_NAME=$(grep -hE "versionName" mobile/build.gradle build.gradle 2>/dev/null | grep -oE "[0-9]+\.[0-9]+(\.[0-9]+)?" | head -1)
          VER_CODE=$(grep -hE "versionCode" mobile/build.gradle build.gradle 2>/dev/null | grep -oE "[0-9]+" | head -1)
          VER_NAME=${VER_NAME:-0.0.0}
          VER_CODE=${VER_CODE:-1}
          TAG_NAME="v${VER_NAME}-$(date +%Y%m%d%H%M)"
          echo "發布版本: $TAG_NAME (versionCode: $VER_CODE)"

          gh release create "$TAG_NAME" "$APK_PATH#YGOMobile-TC.apk" \
            --title "YGOMobile 繁體中文版 $VER_NAME" \
            --notes "自動同步官方最新版本與卡庫。"

          export APK_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/YGOMobile-TC.apk"
          export VER_NAME VER_CODE
          # 已對齊官方真實 ver_code.json 格式 (versionname 全小寫、download_link 陣列)
          python3 - << 'PYEOF'
          import json, os, datetime

          now = datetime.datetime.now()
          update_time_str = f"{now.year}年{now.month}月"

          data = {
              "versionname": os.environ["VER_NAME"],
              "update_time": update_time_str,
              "download_link": [
                  os.environ["APK_URL"]
              ],
              "pre_release_code": {}
          }

          with open("ver_code.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PYEOF


          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ver_code.json
          git commit -m "docs: 自動更新 ver_code.json 版本至 $TAG_NAME" || true
          git push origin HEAD:"$DEFAULT_BRANCH" || {
            git fetch origin "$DEFAULT_BRANCH"
            git rebase --autostash "origin/$DEFAULT_BRANCH"
            git push origin HEAD:"$DEFAULT_BRANCH"
          }
