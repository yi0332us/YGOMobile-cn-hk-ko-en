name: Build YGOMobile TC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 檢出專案原始碼
        uses: actions/checkout@v4

      - name: 配置 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝 OpenCC
        run: pip install opencc

      - name: 下載 libWindbot.aar（並驗證係真 AAR）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p mobile/libs
          # 喺 mercury233/libWindbot 嘅 releases 入面搵第一個 .aar 附件
          URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/mercury233/libWindbot/releases?per_page=30" \
            | python3 -c "
          import sys, json
          for rel in json.load(sys.stdin):
              for a in rel.get('assets', []):
                  if a['name'].lower().endswith('.aar'):
                      print(a['browser_download_url']); sys.exit(0)
          ")
          echo "AAR URL = $URL"
          if [ -z "$URL" ]; then
            echo "::error::搵唔到任何 .aar 附件，請手動上載 libWindbot.aar 到 mobile/libs/"
            exit 1
          fi
          curl -fL -o mobile/libs/libWindbot.aar "$URL"
          ls -l mobile/libs/libWindbot.aar
          # 驗證：真 AAR 一定有 AndroidManifest.xml
          unzip -l mobile/libs/libWindbot.aar | grep -q AndroidManifest.xml \
            || { echo "::error::下載咗嘅唔係有效 AAR"; exit 1; }

      - name: 下載卡庫、字型、腳本
        run: |
          set -e
          mkdir -p mobile/assets/data/fonts
          zip -q mobile/assets/data/pics.zip .gitignore
          curl -fL -o mobile/assets/data/cards.cdb https://github.com/mycard/ygopro-database/raw/master/locales/zh-CN/cards.cdb
          curl -fL -o mobile/assets/data/fonts/ygo.ttf https://github.com/fallenstardust/YGOMobile-cn-ko-en/releases/download/sounds/ygo.ttf
          curl -fL -o scripts_master.zip https://github.com/mycard/ygopro-scripts/archive/refs/heads/master.zip
          unzip -q scripts_master.zip
          mv ygopro-scripts-master script
          zip -rq mobile/assets/data/scripts.zip script
          rm -rf script scripts_master.zip

      - name: 下載音效（搵到就裝，搵唔到只警告唔令建置失敗）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p mobile/assets/data/sound
          URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/fallenstardust/YGOMobile-cn-ko-en/releases/tags/sounds" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          names = [(a['name'], a['browser_download_url']) for a in d.get('assets', [])]
          print('ASSETS:', [n for n, _ in names], file=sys.stderr)
          for n, u in names:
              if n.lower().endswith('.zip') and ('sound' in n.lower() or 'audio' in n.lower() or 'bgm' in n.lower()):
                  print(u); break
          " ) || URL=""
          echo "SOUND URL = $URL"
          if [ -z "$URL" ]; then
            echo "::warning::搵唔到音效壓縮包，今次唔包含音效"
            exit 0
          fi
          curl -fL -o sound.zip "$URL"
          rm -rf snd_tmp && mkdir snd_tmp
          unzip -qo sound.zip -d snd_tmp
          if [ -d snd_tmp/sound ]; then cp -r snd_tmp/sound/. mobile/assets/data/sound/; else cp -r snd_tmp/. mobile/assets/data/sound/; fi
          rm -rf snd_tmp sound.zip
          find mobile/assets/data/sound -type f | head -10
          du -sh mobile/assets/data/sound

      - name: 繁中化卡庫與系統提示
        run: |
          python - << 'PYEOF'
          import os, re, sqlite3, opencc
          import xml.etree.ElementTree as ET

          cc = opencc.OpenCC('s2twp.json')

          # 1. 繁中化 cards.cdb
          cdb_path = 'mobile/assets/data/cards.cdb'
          conn = sqlite3.connect(cdb_path)
          c = conn.cursor()
          cols = ['name', 'desc'] + [f'str{i}' for i in range(1, 17)]
          c.execute(f"SELECT id, {', '.join(cols)} FROM texts")
          rows = c.fetchall()
          updated = [tuple(cc.convert(v) if v else '' for v in r[1:]) + (r[0],) for r in rows]
          c.executemany(
              f"UPDATE texts SET {', '.join(k + '=?' for k in cols)} WHERE id=?", updated)
          conn.commit()
          conn.close()
          print('cards.cdb 完成', len(rows))

          # 2. 繁中化本專案內建手機版 strings.conf 並同步輸出雙路徑
          conf_src = 'mobile/assets/data/conf/strings.conf'
          if not os.path.exists(conf_src):
              conf_src = 'mobile/assets/data/strings.conf'

          with open(conf_src, 'r', encoding='utf-8') as f:
              text = f.read()

          converted_conf = cc.convert(text)

          os.makedirs('mobile/assets/data/conf', exist_ok=True)
          with open('mobile/assets/data/conf/strings.conf', 'w', encoding='utf-8') as f:
              f.write(converted_conf)
          with open('mobile/assets/data/strings.conf', 'w', encoding='utf-8') as f:
              f.write(converted_conf)
          print('strings.conf 繁中化完成（已鏡像至 data/ 及 data/conf/）')

          # 3. 繁中化伺服器清單 serverlist.xml
          for s_path in ['mobile/src/main/assets/serverlist.xml', 'mobile/assets/serverlist.xml', 'mobile/src/main/assets/server_list.xml']:
              if os.path.exists(s_path):
                  with open(s_path, 'r', encoding='utf-8') as f:
                      s_text = f.read()
                  converted_s = cc.convert(s_text)
                  ET.fromstring(converted_s.encode('utf-8'))
                  with open(s_path, 'w', encoding='utf-8') as f:
                    f.write(converted_s)
                  print(f'{s_path} 伺服器列表完成')

          # 4. 繁中化說明文檔（嚴格 UTF-8；解碼失敗或冇變化就唔郁，避免弄壞檔案）
          for root, dirs, files in os.walk('mobile'):
              if 'assets' in root and 'build' not in root and '/sound' not in root:
                  for file in files:
                      if file.endswith(('.txt', '.html', '.md', '.json')) and not file.endswith(('output-metadata.json', 'version.txt')):
                          fpath = os.path.join(root, file)
                          try:
                              with open(fpath, 'r', encoding='utf-8') as f:
                                  content = f.read()
                              conv = cc.convert(content)
                              if conv != content:
                                  with open(fpath, 'w', encoding='utf-8') as f:
                                      f.write(conv)
                                  print(f'文本資源完成: {fpath}')
                          except UnicodeDecodeError:
                              print(f'跳過（非 UTF-8）: {fpath}')

          # 5. 繁中化 strings.xml
          xml_path = 'mobile/src/main/res/values/strings.xml'
          if os.path.exists(xml_path):
              with open(xml_path, 'r', encoding='utf-8') as f:
                  text = f.read()
              out = re.sub(r'>([^<]+)<', lambda m: '>' + cc.convert(m.group(1)) + '<', text)
              ET.fromstring(out.encode('utf-8'))
              with open(xml_path, 'w', encoding='utf-8') as f:
                  f.write(out)
              print('strings.xml 完成')
          PYEOF


      - name: 配置 Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Android NDK (r29)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: 編譯遊戲 C++ 核心
        run: |
          chmod +x gradlew
          ./gradlew :libcore:buildYgoCore -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000

      - name: 打包 APK（只打 cn 版 debug）
        run: ./gradlew :mobile:assembleCnDebug --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m" -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000

      - name: 收集 APK（副檔名係 .Apk，要唔分大細楷）
        run: |
          mkdir -p dist
          find mobile/build/outputs/apk -type f -iname "*.apk" | while read -r f; do
            base=$(basename "${f%.*}")
            cp -v "$f" "dist/${base}.apk"
          done
          ls -lh dist/
          ls dist/*.apk > /dev/null 2>&1 || { echo "::error::搵唔到 APK"; exit 1; }

      - name: 上載 APK
        uses: actions/upload-artifact@v4
        with:
          name: YGOMobile-TC
          path: dist/*.apk
          if-no-files-found: error
