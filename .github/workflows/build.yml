name: Build YGOMobile TC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案原始碼
        uses: actions/checkout@v4

      - name: 配置 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝簡繁轉換工具 OpenCC
        run: pip install opencc

      - name: 下載編譯必備組件與資源 (Windbot/字型/卡庫/腳本)
        run: |
          mkdir -p mobile/libs
          mkdir -p mobile/assets/data/fonts
          
          # 1. 下載專案必備的 libWindbot.aar
          echo "正在下載 libWindbot.aar..."
          curl -L -o mobile/libs/libWindbot.aar https://github.com/fallenstardust/YGOMobile-cn-ko-en/releases/download/sounds/libWindbot.aar || \
          curl -L -o mobile/libs/libWindbot.aar https://github.com/mercury233/libWindbot/releases/download/v1.0.3/libWindbot.aar

          # 2. 建立卡圖包 pics.zip 佔位檔
          zip -q mobile/assets/data/pics.zip .gitignore

          # 3. 抓取官方最新卡庫 (cards.cdb)
          echo "正在下載最新 cards.cdb..."
          curl -L -o mobile/assets/data/cards.cdb https://github.com/mycard/ygopro-database/raw/master/locales/zh-CN/cards.cdb
          
          # 4. 抓取官方系統提示字 (strings.conf)
          echo "正在下載最新 strings.conf..."
          curl -L -o mobile/assets/data/strings.conf https://github.com/mycard/ygopro-database/raw/master/locales/zh-CN/strings.conf

          # 5. 抓取字型檔 (ygo.ttf)
          echo "正在下載遊戲字型..."
          curl -L -o mobile/assets/data/fonts/ygo.ttf https://github.com/fallenstardust/YGOMobile-cn-ko-en/releases/download/sounds/ygo.ttf

          # 6. 打包卡片腳本 (scripts.zip)
          echo "正在下載並打包 scripts.zip..."
          curl -L -o scripts_master.zip https://github.com/mycard/ygopro-scripts/archive/refs/heads/master.zip
          unzip -q scripts_master.zip
          mv ygopro-scripts-master script
          zip -rq mobile/assets/data/scripts.zip script
          rm -rf script scripts_master.zip

      - name: 繁中化卡庫與系統提示（安全保留 XML 格式）
        run: |
          python - << 'EOF'
          import os, re, sqlite3, opencc

          cc = opencc.OpenCC('s2twp.json')

          # 1. 繁中化 cards.cdb
          cdb_path = 'mobile/assets/data/cards.cdb'
          if os.path.exists(cdb_path):
              conn = sqlite3.connect(cdb_path)
              c = conn.cursor()
              c.execute('SELECT id, name, desc, str1, str2, str3, str4, str5, str6, str7, str8, str9, str10, str11, str12, str13, str14, str15, str16 FROM texts')
              rows = c.fetchall()
              updated = []
              for r in rows:
                  card_id = r[0]
                  converted = [cc.convert(col) if col else '' for col in r[1:]]
                  updated.append(tuple(converted) + (card_id,))
              c.executemany('''
                  UPDATE texts SET 
                      name=?, desc=?, str1=?, str2=?, str3=?, str4=?, str5=?, str6=?, str7=?, str8=?,
                      str9=?, str10=?, str11=?, str12=?, str13=?, str14=?, str15=?, str16=? 
                  WHERE id=?
              ''', updated)
              conn.commit()
              conn.close()
              print(f'cards.cdb 繁中化完成，共處理 {len(rows)} 張卡片')

          # 2. 繁中化 strings.conf
          conf_path = 'mobile/assets/data/strings.conf'
          if os.path.exists(conf_path):
              with open(conf_path, 'r', encoding='utf-8', errors='ignore') as f:
                  text = f.read()
              with open(conf_path, 'w', encoding='utf-8') as f:
                  f.write(cc.convert(text))
              print('strings.conf 繁中化完成')

          # 3. 安全繁中化 strings.xml (僅替換標籤文字內容，保留標籤名與屬性)
          xml_path = 'mobile/src/main/res/values/strings.xml'
          if os.path.exists(xml_path):
              with open(xml_path, 'r', encoding='utf-8', errors='ignore') as f:
                  text = f.read()
              # 正則只轉換 > 與 < 之間的文本
              def convert_tag(match):
                  return '>' + cc.convert(match.group(1)) + '<'
              converted_xml = re.sub(r'>([^<]+)<', convert_tag, text)
              with open(xml_path, 'w', encoding='utf-8') as f:
                  f.write(converted_xml)
              print('strings.xml 安全繁中化完成')
          EOF

      - name: 配置 Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Android NDK (r29)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: 編譯遊戲 C++ 核心
        run: |
          chmod +x gradlew
          ./gradlew :libcore:buildYgoCore

      - name: 打包繁中版 APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 發布繁中 APK 供手機下載
        uses: actions/upload-artifact@v4
        with:
          name: YGOMobile-繁體中文版
          path: mobile/build/outputs/apk/debug/*.apk
